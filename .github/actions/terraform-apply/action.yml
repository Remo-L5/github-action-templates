name: 'Terraform Apply'
description: 'Apply a previously generated Terraform plan (tfplan).'

inputs:
  client-id:
    description: 'Azure AD application (client) ID used for OIDC login.'
    required: true
  tenant-id:
    description: 'Azure AD tenant ID.'
    required: true
  subscription-id:
    description: 'Azure subscription ID.'
    required: true
  module-path:
    description: 'Path to the Terraform root module (relative to the workspace).'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Terraform Apply
      shell: pwsh
      env:
        ARM_CLIENT_ID: ${{ inputs.client-id }}
        ARM_TENANT_ID: ${{ inputs.tenant-id }}
        ARM_SUBSCRIPTION_ID: ${{ inputs.subscription-id }}
        ARM_USE_OIDC: 'true'
        ARM_USE_AZUREAD: 'true'
        # Accounts for eventually consistent management group permissions propagation
        AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME: '60m'
      run: |
        $modulePath = "${{ inputs.module-path }}"
        if ([string]::IsNullOrWhiteSpace($modulePath)) { $modulePath = "." }

        $command = "terraform"
        $arguments = @()
        $arguments += "-chdir=$modulePath"
        $arguments += "apply"
        $arguments += "-auto-approve"
        $arguments += "tfplan"
        Write-Host "Running: $command $arguments"
        & $command @arguments
        if ($LASTEXITCODE -ne 0) { throw "terraform apply failed with exit code $LASTEXITCODE" }
